<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Danmaku Shrine 弹幕魔境</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0812;font-family:"Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{background:rgba(14,10,24,.85);border:1px solid rgba(255,120,120,.25);border-radius:10px;backdrop-filter:blur(3px)}

  #hud{position:fixed;left:14px;top:12px;z-index:10;color:#f0e8e0;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  #score{font-size:26px;font-weight:700;color:#ffd9c8;text-shadow:0 0 12px rgba(255,120,90,.5)}
  #best{font-size:12px;color:#9a88a8}
  #lives{font-size:15px;color:#ff9a8a}
  #bombs{font-size:14px;color:#8ad8ff}
  #graze{font-size:13px;color:#d8c8f0}
  #bosstag{font-size:13px;color:#ffb0a0}
  #hint{font-size:11px;color:#8078a0;max-width:250px;line-height:1.4}

  #bossbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(430px,56vw);z-index:10;pointer-events:none;display:none}
  #bossname{font-size:13px;color:#ffc8b0;text-align:center;letter-spacing:3px;margin-bottom:4px;text-shadow:0 0 8px rgba(230,90,70,.6)}
  #bosstrack{height:12px;background:rgba(10,6,14,.85);border:1px solid rgba(255,130,100,.4);border-radius:6px;overflow:hidden}
  #bossfill{height:100%;width:100%;background:linear-gradient(90deg,#c9302e,#f08060);transition:width .15s}
  #spelltag{font-size:11px;color:#d8b8e8;text-align:center;margin-top:3px}

  #tr{position:fixed;right:14px;top:12px;z-index:12;display:flex;gap:8px}
  #tr button{width:40px;height:40px;border-radius:9px;border:1px solid rgba(255,120,120,.3);background:rgba(14,10,24,.85);color:#ffc8b0;font-size:16px;cursor:pointer}
  #tr button.on{background:rgba(80,36,36,.9)}

  #banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);z-index:14;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
  #banner.show{opacity:1}
  #banner .bmain{font-size:34px;font-weight:700;color:#ffd9c8;text-shadow:0 0 20px rgba(255,110,80,.8),0 2px 6px #000;letter-spacing:5px}
  #banner .bsub{font-size:14px;color:#c8b8d8;margin-top:6px;text-shadow:0 1px 4px #000}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:14;background:rgba(14,10,24,.9);border:1px solid rgba(255,120,120,.35);color:#f0e8e0;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}

  #title,#end{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,rgba(50,20,30,.93),rgba(10,6,14,.97));color:#f0e8e0;text-align:center}
  #title h1{margin:0;font-size:50px;letter-spacing:9px;color:#ff9a8a;text-shadow:0 0 26px rgba(255,100,80,.55)}
  #title h2{margin:0;font-size:15px;font-weight:400;color:#a088b0;letter-spacing:6px}
  #title .howto{max-width:450px;font-size:13.5px;line-height:1.95;color:#d0c0d8;margin:8px 18px}
  #titlebest{font-size:13px;color:#ffb090}
  .btns{display:flex;gap:14px;margin-top:8px}
  .btns button{padding:13px 42px;font-size:19px;letter-spacing:5px;color:#1a0808;background:linear-gradient(180deg,#ffb0a0,#e85848);border:none;border-radius:26px;cursor:pointer;box-shadow:0 4px 18px rgba(230,90,70,.45)}
  .btns button:active{transform:translateY(2px)}
  .btns button.ghost{background:rgba(60,30,40,.9);color:#ffb0a0;border:1px solid rgba(255,120,120,.4);box-shadow:none}
  #end{display:none}
  #end h1{margin:0;font-size:40px;letter-spacing:8px;color:#ff9a8a}
  #endd{font-size:15px;line-height:2;color:#d0c0d8;white-space:pre-line}
  .hide{display:none!important}

  /* touch zones */
  #touch{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
  #touch.on{display:block}
  .tzone{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(240,220,220,.5);border-radius:12px}
  #tpad{left:12px;bottom:12px;width:44%;height:30%;background:rgba(80,40,60,.15)}
  #tfocus{right:12px;bottom:16%;width:20%;height:13%;background:rgba(80,60,120,.2)}
  #tbomb{right:12px;bottom:2%;width:20%;height:13%;background:rgba(40,60,110,.2)}

  @media (max-width:540px){
    #title h1{font-size:32px;letter-spacing:5px}
    #score{font-size:22px}
    #hint{display:none}
  }
</style>
<script>window.__BOOTERR=[];window.addEventListener('error',e=>{window.__BOOTERR.push(String(e.message||e));if(window.__G&&window.__G.err)window.__G.err.push(String(e.message||e));});</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="best">纪录 0</div>
  <div id="lives">残机 ✦✦✦</div>
  <div id="bombs">灵击 ✺✺✺</div>
  <div id="graze">擦弹 0 (灵击槽 0%)</div>
  <div id="bosstag"></div>
  <div id="hint">方向键移动 · Shift 低速精确(显示判定点) · X 灵击清屏 · 贴弹擦弹攒灵击槽</div>
</div>

<div id="bossbar">
  <div id="bossname"></div>
  <div id="bosstrack"><div id="bossfill"></div></div>
  <div id="spelltag"></div>
</div>

<div id="tr">
  <button id="mutebtn" title="静音 (M)">🔊</button>
  <button id="pausebtn" title="暂停 (P)">❚❚</button>
</div>

<div id="banner"><div class="bmain"></div><div class="bsub"></div></div>
<div id="toast"></div>

<div id="title">
  <h1>弹幕魔境</h1>
  <h2>DANMAKU SHRINE · 四魔 Boss 战</h2>
  <div class="howto">
    四位魔物镇守魔境，每位两阶段弹幕<br>
    判定点只有 2.5px——按住 Shift 精确穿梭<br>
    贴弹擦弹每枚 +10 分，擦弹槽满 100 送灵击<br>
    撑过符卡计时=收取奖励，击破全部四魔通关！
  </div>
  <div id="titlebest"></div>
  <div class="btns"><button id="startbtn">参 上</button></div>
</div>

<div id="end">
  <h1 id="endh">魔境长眠</h1>
  <div id="endd"></div>
  <div class="btns"><button id="go">续战(罚 30% 分)</button><button id="go2" class="ghost">回标题</button></div>
</div>

<div id="touch">
  <div class="tzone" id="tpad">移动</div>
  <div class="tzone" id="tfocus">低速</div>
  <div class="tzone" id="tbomb">灵击</div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
