<!DOCTYPE html>
<html lang="en" class="SG-game-show" style="background:none;background-color:transparent; width:100%;">
<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta charset="UTF-8">

<meta http-equiv="Content-Type" content="text/html">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="index,follow">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="description" content="Sea Treasure Match is a classic match-3 puzzle HTML5 game: swap sea gems, trigger combos and beat the clock across many challenging levels.">
<meta name="keywords" content="sea treasure match, match 3, puzzle game, gem swap, html5 game, casual game">
<title>Sea Treasure Match</title>
<style type="text/css"> * { padding: 0px; margin: 0px; cursor: default; } body { font: 12px/20px Palatino; }
/* Legacy platform splash (Chinese branded logo) self-hide is broken in modern browsers */
#splashscreen { display: none !important; }</style>

</head>
<body>

<div id="spilgames-root"></div>
<script>
// Removed platform profiling SDK: game.min.js calls _SPTimer.start/end at load.
// Provide local no-ops so startup does not abort.
window._SPTimer = { start: function () {}, end: function () {} };
window.SpilGamesBrandTimer = 0;
</script>
<script type="text/javascript" src="SeaTreasureMatch_files/game.min.js"></script>

    <script>
// LightGame platform bridge: home + share (replaces legacy platform glue)
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }).catch(function(){}); }
}
function goHome() { lgGoHome(); }
function clickMore() { lgGoHome(); }
function dp_Ranking() { lgGoHome(); }
function dp_share(score) { lgShare(score); }
function show_share(score) { lgShare(score); }
function dp_submitScore(score) { if (typeof updateShare === 'function') { updateShare(score); } }
    </script>

    <script>
        // Game calls dp_submitScore(level, score) - use the score argument.
        function dp_submitScore(level, score) {
            if (typeof updateShare === 'function') { updateShare(score); }
        }
        function updateShare(score) {
            document.title = "Sea Treasure Match - I scored " + score + " points! Can you beat my match-3 skills?";
        }
    </script>
</body></html>

<script src="audio.js?v=1"></script>
