<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8" />
    	<title>Prison Whack</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name="description" content="Prison Whack is a fast-paced whack-a-mole HTML5 game: stop the escaping convicts in 35 seconds, dodge the girls, and rack up combo scores.">
        <meta name="keywords" content="prison whack, whack a mole, arcade game, html5 game, reflex game, casual game">

        <meta name="full-screen" content="true"/>
        <meta name="screen-orientation" content="portrait"/>
        <meta name="x5-fullscreen" content="true"/>
        <meta name="360-fullscreen" content="true"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta http-equiv="Access-Control-Allow-Origin" content="*">
    	<style>
    		body {
    		    text-align: center;
    			margin: 0;
    			padding: 0;
    			border: 0;
    			background-color: #000000;
    			height: 100%;
    		}
    	</style>
    </head>
    <body>
    	<script src="js/pixi.js"></script>
    	<script src="js/game.js"></script>
    	<script>
// LightGame platform bridge: home + share (replaces legacy platform glue)
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }).catch(function(){}); }
}
function goHome() { lgGoHome(); }
function clickMore() { lgGoHome(); }
function dp_Ranking() { lgGoHome(); }
function dp_share(score) { lgShare(score); }
function show_share(score) { lgShare(score); }
function dp_submitScore(score) { if (typeof updateShare === 'function') { updateShare(score); } }
	</script>
		<script type="text/javascript">
		function updateShare(score) {
			document.title = "Prison Whack - I stopped " + score + " convicts in 35 seconds! Can you beat me?";
		}
		</script>
	</body>
</html>
