<style>
.linear_gradient_square {
display: block;

background: -o-linear-gradient(left,#0000ff 0%,#00ff00 50%,#ff0000 100%);
background: -ms-linear-gradient(left,#0000ff 0%,#00ff00 50%,#ff0000 100%);
background: linear-gradient(to right,#0000ff 0%,#00ff00 50%,#ff0000 100%);
-ms-color:transparent;
-moz-background-clip: text;
  -webkit-background-clip: text;
  -o-background-clip: text;
  background-clip: text;
  color: transparent;
}

</style>
<script>
var share_score = 2000;
// LightGame platform bridge: home + share
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  var text = 'I scored ' + (score !== undefined ? score : share_score) + ' in Dream Merge 2048! Can you make your dream come true?';
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, text: text, url: window.location.href }).catch(function(){}); }
}
function goHome() { lgGoHome(); }
function clickMore() { lgGoHome(); }
function dp_Ranking() { lgGoHome(); }
function dp_share(score) { lgShare(score); }
function show_share(score) { lgShare(score); }
function dp_submitScore(score) { share_score = score; if (typeof updateShare === 'function') updateShare(score); }
function updateShare(score) {
  share_score = score;
  document.title = 'Dream Merge 2048 - I scored ' + score + '! Can you beat me?';
}
</script>
