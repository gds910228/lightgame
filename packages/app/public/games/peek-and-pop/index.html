<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="expires" content="-1">
    <link rel="stylesheet" type="text/css" href="./js/m.min.css">
    <title>Peek and Pop</title>
    <meta name="description" content="Peek and Pop - a 30 second whack-a-mole reaction game. Tap the peeking faces for points and avoid the decoys!">
    <meta name="keywords" content="peek and pop, whack a mole, reaction game, tapping, casual, html5 game">
</head>
<body>
<div id="layout">
    <div id="loading" class="page show hide">loading</div>
    <div id="index" class="page show">
        <div class="app_name">Peek and Pop</div>
        <div class="app_desc">Tap the peeking faces!</div>
        <div class="p_btns">
            <span class="btn_start_game js_start_game">Start Game</span>
        </div>
    </div>
    <div id="game" class="page hide">
        <div id="game_header">
            <span class="score">Score: <span>0</span></span>
            <span class="count_down"></span>
            <span class="btn_pause js_pause_game">Pause</span>
        </div>
        <div id="box">
            <div class="inner">
                <div class="hole" id="hole1">
                    <div class="meizi" data-id="0"></div>
                </div>
                <div class="hole" id="hole2">
                    <div class="meizi" data-id="1"></div>
                </div>
                <div class="hole" id="hole3">
                    <div class="meizi" data-id="2"></div>
                </div>
                <div class="hole" id="hole4">
                    <div class="meizi" data-id="3"></div>
                </div>
                <div class="hole" id="hole5">
                    <div class="meizi" data-id="4"></div>
                </div>
                <div class="hole" id="hole6">
                    <div class="meizi" data-id="5"></div>
                </div>
                <div class="hole" id="hole7">
                    <div class="meizi" data-id="6"></div>
                </div>
                <div class="hole" id="hole8">
                    <div class="meizi" data-id="7"></div>
                </div>
                <div class="hole" id="hole9">
                    <div class="meizi" data-id="8"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="gameover" class="page hide"></div>
    <div id="game_pause" class="page hide">
        <div class="share">
            <img src="fx.png" width="160">
        </div>
        <div class="pause_txt">Game Paused</div>
        <div class="p_btns">
            <span class="btn_continue js_game_continue">Resume</span>
        </div>
        <div class="p_btns"><a href="#" onclick="lgGoHome()" class="btn_download_game js_download_game">More Games</a></div>
       
    </div>
</div>
<script type="text/html" id="tpl_gameover">
    <div class="share">
        <img src="fx.png" width="160">
    </div>
    <div class="score">
        <p class="result">You popped <%= score %> faces and beat <%= percent %>% of players! Rank:</p>
        <p class="name"><%= name %></p>
        <p class="congratulation"><%= congratulation %></p>
    </div>

    <div class="pic"><img src="<%= img %>" alt=""></div>
    <div class="msg"><%= desc %></div>

    <div class="do_more"><%= doMore %></div>

    <div class="p_btns">
        <span class="btn_play_again js_game_again">Play Again</span>
    </div>
    <div class="p_btns">
        <a href="#" onclick="lgGoHome()" class="btn_download_game js_download_game">More Games</a>
    </div>

</script>
<script src="./js/libs.min.js"></script>
<script src="./js/main.min.js"></script>


<script>
function lgGoHome(){try{if(window.parent&&window.parent!==window){window.parent.location.href='/';}else{window.location.href='/';}}catch(e){window.location.href='/';}}
function goHome(){lgGoHome();}
function clickMore(){lgGoHome();}
function lgShare(score){
  try{if(window.parent&&window.parent!==window&&typeof window.parent.handleGlobalShare==='function'){window.parent.handleGlobalShare(score);return;}}catch(e){}
  if(navigator.share){navigator.share({title:document.title,text:'I popped '+score+' faces in Peek and Pop! Can you beat me?',url:window.location.href}).catch(function(){});}
}
function dp_share(score){lgShare(score);}
function show_share(score){lgShare(score);}
function dp_submitScore(score){if(typeof updateShare==='function')updateShare(score);}
function updateShare(score){document.title='Peek and Pop - I popped '+score+' faces! Can you beat me?';}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a');if(a&&a.classList&&a.classList.contains('js_download_game')){e.preventDefault();lgGoHome();}});
</script>
</body></html>
<script src="audio.js?v=1"></script>
