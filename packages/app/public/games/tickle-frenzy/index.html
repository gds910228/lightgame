<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
      <title>Tickle Frenzy</title>
          <meta charset="utf-8">
          <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <meta name="description" content="Tickle Frenzy - a 10-second reaction tapping game. Tap the colored feather buttons to tickle the moving feet as many times as you can!">
          <meta name="keywords" content="tickle frenzy, tapping game, reaction game, 10 second challenge, casual game, html5 game">
          <meta name="format-detection" content="telephone=no">
          <link rel="stylesheet" href="css/35/index.css">
          <style type="text/css">
              body { font-family: Arial, Helvetica, sans-serif; }
          </style>
    </head>
    <body>
    <div class="screen" id="contentScreen">
    <div class="intro" style="top: 124px;"><h1>Tickle Frenzy</h1>

        <p>Tickle the feet as many times as you can in 10 seconds.<br>Quickly tap the colored feather buttons below the feet.</p>
        <button id="start" class="start"></button>
    </div>
    <div class="flex-container container">
        <div class="flex-item col1"></div>
        <div class="flex-item col2"></div>
        <div class="flex-item col3"></div>
    </div>
    <div class="flex-container buttons">
        <div class="flex-item col" data-index="0">
            <div class="col1"></div>
        </div>
        <div class="flex-item col" data-index="1">
            <div class="col2"></div>
        </div>
        <div class="flex-item col" data-index="2">
            <div class="col3"></div>
        </div>
    </div>
    <div id="go" style="top: 204px;"></div>
    <div class="feet" data-index="1" style="display: none; top: 146.5px;"></div>
    <div class="feather" style="display: none; top: 194px;"></div>
    <div id="time">10.0</div>
</div>
<div id="scoreScreen">
    <p class="desc">Nice! You tickled <em>0</em> times in 10 seconds. Share and challenge your friends!</p>
     <div id="result_panel" style="text-align:center;padding-top:260px;position:absolute;top:0;right:0;bottom:0;left:0;background-color:rgba(0,0,0,0.5)">
            <div>
                <button id="reset" onclick="location.href=location.href;" style="font-size:25px;margin-right:10px;">Play Again</button>
                <button id="doScoreShare" style="font-size:25px;margin-right:10px;">Share</button>
                <button id="doHome" style="font-size:25px">More Games</button>
            </div>
        </div>
</div>

<script src="js/35/zepto.js"></script>
<script src="js/35/index4.js"></script>
<script>
// LightGame platform bridge: home + share
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, text: 'I tickled ' + (score||0) + ' times in 10 seconds in Tickle Frenzy! Can you beat me?', url: window.location.href }).catch(function(){}); }
}
function updateShare(score) {
  document.title = 'Tickle Frenzy - I tickled ' + score + ' times in 10 seconds! Can you beat me?';
}
document.getElementById('doScoreShare').addEventListener('click', function () {
  var em = document.querySelector('#scoreScreen .desc em');
  lgShare(em ? parseInt(em.textContent, 10) : 0);
});
document.getElementById('doHome').addEventListener('click', lgGoHome);
</script>
</body>
</html>
