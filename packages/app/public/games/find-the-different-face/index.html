<!DOCTYPE html>
<html lang="en">
	<head>
			<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui">
			<meta http-equiv="pragma" content="no-cache">
			<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
			<meta http-equiv="expires" content="-1">
			<title>Find the Different Face</title>
			<meta name="description" content="Find the Different Face is a spot-the-odd-one-out puzzle game: scan a grid of nearly identical faces, tap the single different one, and see how many rounds you can clear in 60 seconds." />
			<meta name="keywords" content="find the different face, spot the difference, observation game, puzzle, eyesight test, brain teaser, casual game" />
			<link rel="stylesheet" type="text/css" href="m.min.css">
		</head>

		<style>
		html,body{
			margin: 0px;
			padding: 0px;
			border:none;
			text-align: center;

		}
		#container{
		height:90%;

		}
		.lis{overflow: hidden;width: 100%;z-index: 99999;position: absolute;top:0;right:0;left:1}
		.lis a{display: block;width:100%;color:#ffffff;font-size:14px;text-decoration: none;background:#606783;text-align: center;opacity: 0.5;line-height:30px;font-weight: bold;font-family: Arial, sans-serif}
		.lis a img{position: relative;top: 1px;}
		.ads{overflow: hidden;width: 100%;z-index: 999999;position: absolute;bottom:0;right:1}
	    </style>
	<body>

		<div id="container">

		</div>

		<script>
		// LightGame platform bridge: home + share (replaces legacy platform glue)
		var _hmt = []; // no-op analytics stub: legacy tracking calls in main.min.js push into this array
		var lgShareTitle = document.title;
		var lgLastScore = null;
		function lgGoHome() {
			try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
			catch (e) { window.location.href = '/'; }
		}
		function lgShare(score) {
			if (score === undefined || score === null) { score = lgLastScore; }
			try {
				if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
			} catch (e) {}
			if (navigator.share) { navigator.share({ title: lgShareTitle, url: window.location.href }).catch(function(){}); }
		}
		function goHome() { lgGoHome(); }
		function clickMore() { lgGoHome(); }
		function dp_Ranking() { lgGoHome(); }
		function dp_share(score) { lgShare(score); }
		function show_share(score) { lgShare(score); }
		function dp_submitScore(score) { if (typeof updateShare === 'function') { updateShare(score); } }
		function updateShare(score) {
			lgLastScore = score;
			lgShareTitle = "Find the Different Face - I found " + score + " faces! Can you beat me?";
		}
		</script>
	</body>
</html>
<script id="tpl" type="text/html">
<div class="grid">
        <div class="page hide" id="loading">
            <div class="loading-txt"><%=loading%></div>
        </div>
        <div class="page hide" id="index">
            <h1><%=title%></h1>

            <div id="help"><%=help_txt%></div>
            <div class="btns">
                <button data-type="color" class="btn play-btn">
                    <%=btn_start%>
                </button>
				<a href="javascript:void(0);"  onclick="clickMore();" class="btn btn-boyaa">
								<%=btn_more_game%>
				</a>
            </div>
        </div>
        <div class="page hide" id="room">
            <header>
                <span class="lv">
                    <%=score%>
                    <em>
                        1
                    </em>
                </span>
                <span class="time">
                </span>
               <span class="btn btn-pause">
                    <%=btn_pause%>
                </span>

            </header>
            <div id="box" class="lv1">
            </div>
        </div>
        <div class="page hide" id="dialog">
        <div class="inner">
                <div class="content gameover">
                    <div class="inner-content">

                        <h3></h3>
                        <div class="btn-wrap">
                            <button class="btn btn-restart">
                                <%=btn_reTry%>
                            </button>
							<a href="javascript:void(0);" onclick="clickMore();" class="btn btn-boyaa">
								<%=btn_more_game%>
							</a>
                        </div>


                    </div>
                </div>
                <div class="content pause">
                    <div class="inner-content">

                        <h3>
                            <%=game_pause%>
                        </h3>
                        <div class="btn-wrap">
                            <button class="btn btn-resume">
                                <%=btn_resume%>
                            </button>
							<a href="javascript:void(0);" onclick="clickMore();" class="btn btn-boyaa">
								<%=btn_more_game%>
							</a>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
<script src="libs.min.js"></script>
<script src="main.min.js"></script>

<script src="audio.js?v=1"></script>
