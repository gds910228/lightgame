<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1"/>
    <title>Skyscraper Stack</title>
    <meta name="description" content="Skyscraper Stack - time the swinging block perfectly and stack as many floors as you can into the sky.">
    <meta name="keywords" content="skyscraper, stack, tower, timing, arcade, html5 game">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    <style>
        body, canvas, div {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -khtml-user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }
    </style>
</head>
<body style="padding:0; margin: 0; background: #000;">
<canvas id="gameCanvas" width="320" height="480"></canvas>
<script src="src/engine.js"></script>
<script src="src/underscore.min.js"></script>
<script>
// Polyfills used by the game on top of underscore 1.3
if (typeof _ !== 'undefined') {
    if (!_.endsWith) _.endsWith = function (s, suffix) { s = String(s); return s.indexOf(suffix, s.length - suffix.length) !== -1; };
    if (!_.sprintf) _.sprintf = function (fmt) {
        var args = Array.prototype.slice.call(arguments, 1), i = 0;
        return String(fmt).replace(/%[sd]/g, function () { return args[i++]; });
    };
}
</script>
<script>
// Compatibility shims for engine version differences
if (typeof cc !== 'undefined' && !cc.defineGetterSetter) {
    cc.defineGetterSetter = function (exports, prop, getter, setter) {
        getter = getter || function () {};
        setter = setter || function () {};
        Object.defineProperty(exports, prop, { get: getter, set: setter, configurable: true, enumerable: true });
    };
}
</script>
<script src="src/game.min.js"></script>
<script>
// LightGame platform bridge: home + share
var myData = { gameid: "skyscraper-stack", score: 0, scoreName: "" };
window.shareData = {
    imgUrl: "res/mtl_bg.jpg",
    timeLineLink: window.location.href,
    tTitle: "Skyscraper Stack",
    tContent: "How many floors can you stack?"
};
function lgGoHome(){try{if(window.parent&&window.parent!==window){window.parent.location.href='/';}else{window.location.href='/';}}catch(e){window.location.href='/';}}
function lgShare(score){try{if(window.parent&&window.parent!==window&&typeof window.parent.handleGlobalShare==='function'){window.parent.handleGlobalShare(score);return;}}catch(e){}if(navigator.share){navigator.share({title:document.title,text:'I stacked '+score+' floors in Skyscraper Stack! Can you beat me?',url:window.location.href}).catch(function(){});}}
function goHome(){lgGoHome();}
function clickMore(){lgGoHome();}
function dp_Ranking(){lgGoHome();}
function dp_share(){lgShare(myData.score);}
function show_share(){lgShare(myData.score);}
function showAd(){}
function hideAd(){}
function dp_submitScore(score){
    var n=parseInt(score,10)||0;
    myData.score=n;
    myData.scoreName=n+" floors";
    if(typeof updateShare==='function')updateShare(n);
}
function updateShare(score){
    window.shareData.tTitle="Skyscraper Stack - I stacked "+score+" floors! Can you beat me?";
    document.title=window.shareData.tTitle;
}
function onShareComplete(){}
</script>
</body>
</html>
