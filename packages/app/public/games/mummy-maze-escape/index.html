<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta charset="utf-8">
<meta id="viewport" name="viewport" content="width=480,user-scalable=no,uc-user-scalable=no,target-densitydpi=high-dpi" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="description" content="Mummy Maze Escape - guide your explorer through 50 maze rooms, dodge the mummy patrol and reach the exit in this classic puzzle game.">
<meta name="keywords" content="mummy maze, maze puzzle, escape game, 50 levels, retro game, html5 game">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png" />
<link rel="apple-touch-startup-image" href="startup.png">
<script language="javascript" type="text/javascript" src="js/jsgamemin.js"></script>
<script language="javascript" type="text/javascript" src="js/munaiyiguilai.js"></script>
<title>Mummy Maze Escape</title>
<style>
	body{margin:0px; background-color:#434243; color:#6A6A6A; font-family: Arial, sans-serif;}
	.bandiv{float:left; width:100%; background-color:#DBD1BB;}
		.bandiv div{padding:10px; text-align:left;}
</style>
<style>
    html { -ms-touch-action: none; }
</style>
</head>

<body onLoad="main()"  id="0">
<div style="text-align:center;">
	<canvas id="jsGameScreen">
	</canvas>
</div>
<script>
// LightGame platform bridge: home + share
var myData = { gameid: "mummy-maze-escape", score: 0, scoreName: "" };
window.shareData = {
    imgUrl: "icon.png",
    timeLineLink: window.location.href,
    tTitle: "Mummy Maze Escape",
    tContent: "Can you escape all 50 maze rooms?"
};
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, text: window.shareData.tContent, url: window.location.href }).catch(function(){}); }
}
function goHome() { lgGoHome(); }
function clickMore() { lgGoHome(); }
function dp_Ranking() { lgGoHome(); }
function dp_share() { lgShare(myData.score); }
function show_share() { lgShare(myData.score); }
function showAd() {}
function hideAd() {}
function dp_submitScore(score) {
    myData.score = parseInt(score, 10) || 0;
    myData.scoreName = "Cleared " + myData.score + " rooms";
    if (typeof updateShare === 'function') updateShare(myData.score);
}
function updateShare(score) {
    window.shareData.tTitle = "Mummy Maze Escape - I cleared " + score + " rooms! Can you escape too?";
    document.title = window.shareData.tTitle;
}
function onShareComplete(res) {}
</script>
</body>
</html>
