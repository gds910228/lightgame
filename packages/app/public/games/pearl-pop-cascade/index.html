<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pearl Pop Cascade 珠光瀑语</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#150f2e;font-family:"Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{background:rgba(24,16,48,.85);border:1px solid rgba(180,150,255,.3);border-radius:10px;backdrop-filter:blur(3px)}

  #hud{position:fixed;left:14px;top:12px;z-index:10;color:#e8e0ff;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  #score{font-size:28px;font-weight:700;color:#c8f0ff;text-shadow:0 0 14px rgba(140,200,255,.55)}
  #best{font-size:12px;color:#9a90c8}
  #round{font-size:14px;color:#b8a8f0}
  #mult{font-size:15px;color:#ffd166;text-shadow:0 0 10px rgba(255,190,80,.5)}
  #ballcount{font-size:15px;color:#8af0c8}
  #pegcount{font-size:13px;color:#c8b8f0}
  #hint{font-size:11px;color:#8880b0;max-width:250px;line-height:1.4}

  #tr{position:fixed;right:14px;top:12px;z-index:12;display:flex;gap:8px}
  #tr button{width:40px;height:40px;border-radius:9px;border:1px solid rgba(180,150,255,.3);background:rgba(24,16,48,.85);color:#c8b8f0;font-size:16px;cursor:pointer}
  #tr button.on{background:rgba(60,40,100,.9)}

  #banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);z-index:14;text-align:center;pointer-events:none;opacity:0;transition:opacity .22s}
  #banner.show{opacity:1}
  #banner .bmain{font-size:36px;font-weight:700;color:#ffe9a8;text-shadow:0 0 20px rgba(255,180,90,.85),0 2px 6px #000;letter-spacing:5px}
  #banner .bsub{font-size:14px;color:#c8c0f0;margin-top:6px;text-shadow:0 1px 4px #000}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:14;background:rgba(24,16,48,.9);border:1px solid rgba(180,150,255,.35);color:#e8e0ff;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}

  #title,#end{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,rgba(50,34,90,.93),rgba(16,10,36,.97));color:#e8e0ff;text-align:center}
  #title h1{margin:0;font-size:50px;letter-spacing:9px;color:#c8f0ff;text-shadow:0 0 26px rgba(140,190,255,.6)}
  #title h2{margin:0;font-size:15px;font-weight:400;color:#9a90c8;letter-spacing:6px}
  #title .howto{max-width:440px;font-size:13.5px;line-height:1.95;color:#c0b8e8;margin:8px 18px}
  #titlebest{font-size:13px;color:#ffd166}
  .btns{display:flex;gap:14px;margin-top:8px}
  .btns button{padding:13px 42px;font-size:19px;letter-spacing:5px;color:#160a30;background:linear-gradient(180deg,#d0f0ff,#7898f0);border:none;border-radius:26px;cursor:pointer;box-shadow:0 4px 18px rgba(120,150,255,.45)}
  .btns button:active{transform:translateY(2px)}
  .btns button.ghost{background:rgba(46,36,86,.9);color:#c8f0ff;border:1px solid rgba(180,150,255,.4);box-shadow:none}
  #end{display:none}
  #end h1{margin:0;font-size:40px;letter-spacing:8px;color:#c8f0ff}
  #endd{font-size:15px;line-height:2;color:#c8c0f0;white-space:pre-line}
  .hide{display:none!important}

  @media (max-width:540px){
    #title h1{font-size:32px;letter-spacing:5px}
    #score{font-size:22px}
    #hint{display:none}
  }
</style>
<script>window.__BOOTERR=[];window.addEventListener('error',e=>{window.__BOOTERR.push(String(e.message||e));if(window.__G&&window.__G.err)window.__G.err.push(String(e.message||e));});</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="best">纪录 0</div>
  <div id="round">第 1 轮</div>
  <div id="mult">本击倍率 ×1</div>
  <div id="ballcount">钢珠 8</div>
  <div id="pegcount">珍珠 75</div>
  <div id="hint">移动瞄准 · 点击/空格 发射 · 剩 10 颗珍珠触发 FEVER · 接住金壶得免费钢珠</div>
</div>

<div id="tr">
  <button id="mutebtn" title="静音 (M)">🔊</button>
  <button id="pausebtn" title="暂停 (P)">❚❚</button>
</div>

<div id="banner"><div class="bmain"></div><div class="bsub"></div></div>
<div id="toast"></div>

<div id="title">
  <h1>珠光瀑语</h1>
  <h2>PEARL POP CASCADE · 幻珠弹瀑</h2>
  <div class="howto">
    瞄准发射钢珠，击碎梦境珍珠<br>
    一击连珠触发倍率阶梯，紫珍珠本击 ×5<br>
    剩 10 颗珍珠时 FEVER 降临：三连免费珠！<br>
    接住底部游走的金壶再得一珠，清台进入下一轮
  </div>
  <div id="titlebest"></div>
  <div class="btns"><button id="startbtn">开 弹</button></div>
</div>

<div id="end">
  <h1 id="endh">珠瀑落幕</h1>
  <div id="endd"></div>
  <div class="btns"><button id="go">再来一轮</button><button id="go2" class="ghost">回标题</button></div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
