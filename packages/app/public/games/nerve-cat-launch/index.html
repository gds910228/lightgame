<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Nerve Cat Launch</title>
    <meta name="description" content="Nerve Cat Launch is a hilarious slingshot arcade game: fling the flying cat as far as you can and beat your friends' distances.">
    <meta name="keywords" content="nerve cat launch, cat slingshot, arcade game, html5 game, distance challenge, casual game">
    <link rel="icon" href="icon.png" />
    <meta name="viewport"
          content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="full-screen" content="true"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <script src="jquery.min.js"></script>
    <style>
        *{padding: 0; margin: 0;}
        body {
            text-align: center;
            background: #000000;
            padding: 0;
            border: 0;
            margin: 0;
            height: 100%;
        }

        html {

            -ms-touch-action: none; /* Direct all pointer events to JavaScript code. */

        }
    </style>
</head>
<body>
<div style="display:inline-block;width:100%; height:100%;margin: 0 auto; background: black; position:relative;"
     id="gameDiv">
    <canvas id="gameCanvas" width="480" height="800" style="background-color: #000000"></canvas>
</div>
<script type="text/javascript">
	var document_class="GameApp";
</script>
<script src="egret_loader.js"></script>
<script src="game-min2.js"></script>
<script type="text/javascript">
	$(document).ready(function(){
		egret_h5.startGame();
	});
</script>
<script>
// LightGame platform bridge: home + share (replaces legacy platform glue)
function lgGoHome() {
  try { if (window.parent && window.parent !== window) { window.parent.location.href = '/'; } else { window.location.href = '/'; } }
  catch (e) { window.location.href = '/'; }
}
function lgShare(score) {
  try {
    if (window.parent && window.parent !== window && typeof window.parent.handleGlobalShare === 'function') { window.parent.handleGlobalShare(score); return; }
  } catch (e) {}
  if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }).catch(function(){}); }
}
function goHome() { lgGoHome(); }
function clickMore() { lgGoHome(); }
function dp_Ranking() { lgGoHome(); }
function dp_share(score) { lgShare(score); }
function show_share(score) { lgShare(score); }
function dp_submitScore(score) { if (typeof updateShare === 'function') { updateShare(score); } }
</script>
<script type="text/javascript">
	var myData = { gameid: "nerve-cat-launch", score: 0 };
	var lgShareText = "Nerve Cat Launch";
	function updateShare(score) {
		lgShareText = "Nerve Cat Launch - I flung the cat " + score + "m! Can you beat that?";
		document.title = lgShareText;
	}
	function share(text) {
		if (typeof text !== "undefined" && text !== null && text !== "") { document.title = String(text); }
		lgShare(text);
	}
</script>
</body>
</html>
