
<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <meta http-equiv="expires" content="-1">
    <link rel="stylesheet" type="text/css" href="js/m.min.css">
    <title>Pop Star Tap</title>
    <meta name="description" content="Pop Star Tap - a 30 second whack-a-mole reaction game. Tap the popping stars, dodge the decoys and chase the top rank!">
    <meta name="keywords" content="pop star, whack a mole, reaction game, tapping, casual, html5 game">
</head>
<body>
<script src="jquery/2.0.0/jquery.min.js"></script>
<script src="underscore/1.3.3/underscore-min.js"></script>
<div id="layout">
    <div id="loading" class="page show hide">loading</div>
    <div id="index" class="page show">
        <div class="app_name">Pop Star Tap</div>
        <div class="p_btns">
            <span class="btn_start_game js_start_game">Start Game</span>
        </div>
        <div class="p_btns"><a href="javascript:void(0);" onClick="clickMore();" class="btn_download_game js_download_game">More Games</a></div>
    </div>
    <div id="game" class="page hide">
        <div id="game_header">
            <span class="score">Score: <span>0</span></span>
            <span class="count_down"></span>
            <!-- 
            <span class="btn_pause js_pause_game">Pause</span>
             --> 
        </div>
        <div id="box">
            <div class="inner">
                <div class="hole" id="hole1">
                    <div class="meizi" data-id="0"></div>
                </div>
                <div class="hole" id="hole2">
                    <div class="meizi" data-id="1"></div>
                </div>
                <div class="hole" id="hole3">
                    <div class="meizi" data-id="2"></div>
                </div>
                <div class="hole" id="hole4">
                    <div class="meizi" data-id="3"></div>
                </div>
                <div class="hole" id="hole5">
                    <div class="meizi" data-id="4"></div>
                </div>
                <div class="hole" id="hole6">
                    <div class="meizi" data-id="5"></div>
                </div>
                <div class="hole" id="hole7">
                    <div class="meizi" data-id="6"></div>
                </div>
                <div class="hole" id="hole8">
                    <div class="meizi" data-id="7"></div>
                </div>
                <div class="hole" id="hole9">
                    <div class="meizi" data-id="8"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="gameover" class="page hide"></div>
    <div id="game_pause" class="page hide">
        <div class="pause_txt">Game Paused</div>
        <div class="p_btns">
            <span class="btn_continue js_game_continue">Resume</span>
        </div>
        <div class="p_btns"><a href="javascript:void(0);" onClick="clickMore();" class="btn_download_game js_download_game">More Games</a></div>
       
    </div>
</div>
<script type="text/html" id="tpl_gameover">
    <div class="score">
        <p class="result">You popped <%= score %> stars! Rank:</p>
        <p class="name"><%= name %></p>
        <p class="congratulation"><%= congratulation %></p>
    </div>

    <div class="pic"><img src="<%= img %>" alt=""></div>
    <div class="msg"><%= desc %></div>

    <div class="do_more"><%= doMore %></div>

    <div class="p_btns">
        <span class="btn_play_again js_game_again">Play Again</span>
    </div>
    <div class="p_btns">
        <a href="javascript:void(0);" onclick="clickMore();" class="btn_download_game js_download_game">More Games</a>
    </div>

</script>
<script src="js/libs.min.js"></script>
<script src="js/main.min.js"></script>
<script>
var myData = { gameid: "pop-star-tap", score: 0, scoreName: "" };
window.shareData = { imgUrl: "icon.png", timeLineLink: window.location.href, tTitle: "Pop Star Tap", tContent: "How many stars can you pop in 30 seconds?" };
function lgGoHome(){try{if(window.parent&&window.parent!==window){window.parent.location.href='/';}else{window.location.href='/';}}catch(e){window.location.href='/';}}
function lgShare(score){try{if(window.parent&&window.parent!==window&&typeof window.parent.handleGlobalShare==='function'){window.parent.handleGlobalShare(score);return;}}catch(e){}if(navigator.share){navigator.share({title:document.title,text:'I popped '+score+' stars in 30 seconds! Can you beat me?',url:window.location.href}).catch(function(){});}}
function goHome(){lgGoHome();}
function clickMore(){lgGoHome();}
function dp_Ranking(){lgGoHome();}
function dp_share(){lgShare(myData.score);}
function show_share(){lgShare(myData.score);}
function showAd(){}
function hideAd(){}
function dp_submitScore(score){myData.score=parseInt(score,10)||0;myData.scoreName=myData.score+' popped';if(typeof updateShare==='function')updateShare(myData.score);}
function updateShare(score){window.shareData.tTitle='Pop Star Tap - I popped '+score+' stars in 30 seconds! Can you beat me?';document.title=window.shareData.tTitle;}
function onShareComplete(){}
</script>
</body></html>
