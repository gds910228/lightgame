
<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>Peach Catch Frenzy</title>
    <meta name="description" content="Peach Catch Frenzy - move the monkey basket to catch falling peaches and dodge bombs for 59 seconds. How many peaches can you save?">
    <meta name="keywords" content="peach catch, monkey, falling objects, catcher game, casual, html5 game">
    <meta name="viewport" content="user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <style type="text/css">
        body, div, canvas
        {
            image-rendering: optimizeSpeed;
            -webkit-image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
        }

        body{padding:0; margin:0;font-size:12px;background-color:#000;}
        body, html{height: 100%;}
        #outer{height:100%; overflow:hidden; position:relative; width:100%;}
        #outer[id]{display:table; position:static;}
        #middle{position:absolute; top:50%;}
        #middle[id]{display:table-cell; vertical-align:middle; position:static;}
    </style>

    <script type="text/javascript" src="js/quark.base-1.0.0.alpha.min.js"></script>
    <script type="text/javascript" src="js/jquery.js"></script>
    <script type="text/javascript" src="src/Orientation.js"></script>
    <script type="text/javascript" src="src/Button.js"></script>
    <script type="text/javascript" src="src/main.js"></script>
    <script type="text/javascript" src="src/Peach.js"></script>
    <script type="text/javascript" src="src/Monkey.js"></script>
    <script type="text/javascript" src="src/Num.js"></script>

</head>

<body>

<div id="outer">
    <div id="middle">
        <div id="container" style="position:relative;width:100%;height:100%;margin:0 auto;">
        </div>
    </div>
</div>

<audio src="images/a.mp3" preload="auto" loop="true"></audio>

<script>
// LightGame platform bridge: home + share
var imgUrl = "images/peach.png";
var lineLink = window.location.href;
var descContent = 'How many peaches can you catch in 59 seconds?';
var shareTitle = 'Peach Catch Frenzy';
var appid = '';
var myData = { gameid: "peach-catch-frenzy", score: 0, scoreName: "" };
function lgGoHome(){try{if(window.parent&&window.parent!==window){window.parent.location.href='/';}else{window.location.href='/';}}catch(e){window.location.href='/';}}
function lgShare(score){try{if(window.parent&&window.parent!==window&&typeof window.parent.handleGlobalShare==='function'){window.parent.handleGlobalShare(score);return;}}catch(e){}if(navigator.share){navigator.share({title:document.title,text:descContent,url:window.location.href}).catch(function(){});}}
function goHome(){lgGoHome();}
function clickMore(){lgGoHome();}
function shareFriend(){lgShare(myData.score);}
function shareTimeline(){lgShare(myData.score);}
function shareWeibo(){lgShare(myData.score);}
function dp_Ranking(){lgGoHome();}
function dp_share(){lgShare(myData.score);}
function show_share(){lgShare(myData.score);}
function showAd(){}
function hideAd(){}
function dp_submitScore(score){myData.score=parseInt(score,10)||0;myData.scoreName=myData.score+' peaches';if(typeof updateShare==='function')updateShare(myData.score);}
function updateShare(score){shareTitle='Peach Catch Frenzy - I caught '+score+' peaches! Can you beat me?';document.title=shareTitle;}
function onShareComplete(){}
</script>
</body>
</html>
